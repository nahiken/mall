name: ci

# 回归保障：三条独立流水线。
#
# 设计取舍（CI 不提供中间件）：
# - Java 只做编译校验：Spring 测试需要 MySQL / Redis / ES，runner 上没有；
# - Python 只跑纯逻辑/降级分支测试，不连 Redis/ES/DeepSeek；
# - 前端只跑 admin 的 type-check + build。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepseek_agent/llm_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            deepseek_agent/llm_backend/requirements.txt
            deepseek_agent/llm_backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile (syntax gate)
        run: python -m compileall -q mall_agent scripts
      - name: pytest
        run: python -m pytest -q

  java:
    name: java compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 只做编译校验：本仓库的 Spring 测试大多需要 MySQL / Redis / ES，
      # GitHub runner 上没有这些服务，跑 `mvn test` 必然红。
      # 需要跑集成测试时用 @Tag("integration") 并在有中间件的环境里执行：
      #   mvn -B -ntp test -Dgroups=integration
      - name: mvn compile
        run: mvn -B -ntp -DskipTests compile

  web:
    name: admin web type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-admin-web-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mall-admin-web-master/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build-only
