name: ci

# P2-01：回归保障。三条独立流水线，任一红灯即阻断合并。
#
# 设计取舍（本机环境限制，已如实记录在 优化任务清单.md §13.3）：
# - Java 用 `mvn test`（父 pom 已默认跑测试），需要 MySQL 的 @Tag("integration")
#   由 surefire 默认排除，所以 CI 不需要起数据库；
# - Python 只跑纯逻辑/降级分支测试，不连 Redis/ES/DeepSeek；
# - 前端只跑 admin 的 type-check + build（uni-app H5 构建慢且依赖类型工具链
#   存量问题，单列在 P2-05 里跟进）。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepseek_agent/llm_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            deepseek_agent/llm_backend/requirements.txt
            deepseek_agent/llm_backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile (syntax gate)
        run: python -m compileall -q mall_agent scripts
      - name: Static gate (undefined names / redefinitions)
        # pyflakes 的未定义名一定会 NameError（P2-04 拆分时就踩到过：_category_cache
        # 留在原模块、使用者搬走了，import 正常、只有走到那条分支才炸）
        run: python ../../scripts/checks/pyflakes_gate.py
      - name: pytest
        run: python -m pytest -q

  java:
    name: java tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn test
        run: mvn -B -ntp test

  web:
    name: admin web type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-admin-web-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mall-admin-web-master/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build-only
