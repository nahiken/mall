name: secret-scan

# 仓库内不再出现真实凭据的守门检查。
# 只扫工作区（--no-git）：历史提交中的旧密钥无法靠扫描消除，必须轮换失效。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Show gitleaks version
        run: ./gitleaks version
      - name: Detect hardcoded secrets
        run: ./gitleaks detect --no-git --redact -c .gitleaks.toml -v
