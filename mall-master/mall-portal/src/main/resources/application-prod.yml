server:
  port: 8085

# #108 Spec-2：prod 覆盖 base yml 的 jwt.secret 弱默认 → 不注入 JWT_SECRET 即启动失败（fail-fast）。
jwt:
  secret: ${JWT_SECRET}

# P0-02：prod 必须显式注入允许跨域的源（逗号分隔；同源部署注入空串）。
# 不注入 CORS_ALLOWED_ORIGINS 则占位符解析失败 → 启动失败（fail-fast）。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    # P0-03：portal 下单/购物车/地址/会员都是写操作，必须用显式读写账号；不注入即启动失败。
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet:
        # P0-03：prod 关闭 Druid 控制台（默认口令 druid/druid 等于没有口令）
        enabled: false
  data:
    mongodb:
      host: ${MONGO_HOST:mongo}
      port: 27017
      database: mall-port
    redis:
      host: ${REDIS_HOST:redis} # Redis服务器地址（compose 注入 host.docker.internal 走宿主原生）
      database: 0 # Redis数据库索引（默认为0）
      port: 6379 # Redis服务器连接端口
      password: # Redis服务器连接密码（默认为空）
      timeout: 300ms # 连接超时时间（毫秒）
  rabbitmq:
    host: ${RABBIT_HOST:rabbit}
    port: 5672
    virtual-host: /mall
    username: ${RABBIT_USER:mall}
    password: ${RABBIT_PASSWORD:mall}

mongo:
  insert:
    sqlEnable: true # 用于控制是否通过数据库数据来插入mongo

logging:
  file:
    path: /var/logs
  level:
    root: info
    com.macro.mall: info

logstash:
  host: logstash

alipay:
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  appId: your appId
  alipayPublicKey: your alipayPublicKey
  appPrivateKey: your appPrivateKey
  returnUrl: ${ALIPAY_RETURN_URL:http://localhost:8060/#/pages/money/paySuccess}
  notifyUrl:

# P0-03：管理面只暴露 health（portal 无 actuator 依赖，此基线在引入后生效）。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

