spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # P0-04：不写真实密码默认值；本地在 IDE/环境变量或 .env 里设 DB_PASSWORD
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: ${DRUID_USER:druid}
        login-password: ${DRUID_PASSWORD:druid}
  data:
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: ${ES_URIS:localhost:9200}

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  host: localhost
  enableInnerLog: false