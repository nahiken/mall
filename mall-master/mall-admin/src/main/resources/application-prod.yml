# #108 Spec-2：prod 覆盖 base yml 的 jwt.secret 弱默认 → 不注入 JWT_SECRET 即启动失败（fail-fast）。
#   真 prod 由 compose 注入（见 deploy/docker-compose.yml admin JWT_SECRET）。dev 走 base 默认。
jwt:
  secret: ${JWT_SECRET}

# P0-02：prod 必须显式注入允许跨域的源（逗号分隔；同源部署注入空串）。
# 不注入 CORS_ALLOWED_ORIGINS 则占位符解析失败 → 启动失败（fail-fast），
# 避免带着 dev 默认或通配符上线。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    # P0-03：admin 会写商品/订单/营销数据，必须用显式读写账号；不注入即启动失败。
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet:
        # P0-03：prod 关闭 Druid 控制台（默认口令 druid/druid 等于没有口令）
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:redis} # Redis服务器地址（compose 注入 host.docker.internal 走宿主原生）
      database: 0 # Redis数据库索引（默认为0）
      port: 6379 # Redis服务器连接端口
      password: # Redis服务器连接密码（默认为空）
      timeout: 300ms # 连接超时时间（毫秒）
  # ── P2-02：版本化迁移（D3 已拍板引入 Flyway）────────────────────────────
  # 只有 admin 跑迁移：portal/search/gateway 共用同一个 mall 库，四个服务同时迁移
  # 会竞争 schema_history 表。admin 是唯一写业务表的服务，由它当"迁移执行者"最自然。
  #
  # 三种库都能正确处理（baseline-on-migrate 是关键）：
  #   1. 空库          → 非空判定失败 → 依次执行 V1（建表+种子）、V2（索引）；
  #   2. 已有库        → 非空且无 history 表 → 记 baseline 到 version 1（不执行 V1），
  #                      随后执行 V2；V2 幂等，索引已存在的就跳过；
  #   3. 已跑过 V2 的库 → 只校验 checksum，什么都不做。
  #
  # base application.yml 里显式 `spring.flyway.enabled: false`：本地 dev 库是
  # 恢复出来的 dump，不希望在 developer 机器上被自动改 schema。要在本地跑迁移：
  #   mvn -pl mall-admin spring-boot:run -Dspring-boot.run.profiles=prod \
  #     -Dspring-boot.run.arguments=--spring.flyway.enabled=true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "mall.sql baseline (existing schema)"
    validate-on-migrate: true
    # 禁止 flyway clean（会把库删空）；默认已是 true，这里显式写出来防止被误改
    clean-disabled: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000} #MinIO服务所在地址
  bucketName: mall #存储桶名称
  accessKey: ${MINIO_ACCESS_KEY:minioadmin} #访问的key
  secretKey: ${MINIO_SECRET_KEY:minioadmin} #访问的秘钥

logging:
  file:
    path: /var/logs
  level:
    root: info
    com.macro.mall: info

logstash:
  host: logstash

# P0-03：管理面只暴露 health（当前 admin 未引 actuator 依赖，此基线在引入后生效，
# 且 /actuator/** 已不在 secure.ignored.urls 白名单里）。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never