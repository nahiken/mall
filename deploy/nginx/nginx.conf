# #108 生产形态 nginx：单入口 :80 serve 前端 dist + 反代 gateway(:8090)。
# 拓扑：浏览器 → nginx:80（静态 dist / 反代） → gateway:8090（限流+剥前缀） → 各上游
#   /agent-api /mall-api /search-api /admin-api /rag-api（gateway 路由，见 mall-gateway yml）
# 本配置在容器内跑（deploy/nginx/Dockerfile 内置 dist + 本文件）。改动生效需重建 nginx 容器。
worker_processes auto;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile on;
    keepalive_timeout 65;

    # SSE/WS：1.1 + 关缓冲 + 足够读超时；gateway 自身是 Netty（长连接友好）
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    # X-Real-IP 由本层以真实对端覆盖写入；gateway RATE_LIMIT_TRUST_PROXY=true 时读它做 IP 限流键
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream gateway_upstream {
        server gateway:8090;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # ── P2-06 容器健康检查端点 ──────────────────────────────────────
        # 只证明 nginx 自身还能接连接、读配置，**不代表**上游 gateway/后端健康
        # （上游各自的 healthcheck 由 compose 管）。access_log off 避免 30s 一条噪音。
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── admin 前端 dist（location /）─────────────────────────────────
        # 构建产物已 COPY 到 /usr/share/nginx/html/（index.html + assets/）。
        # SPA fallback：未知路径回 index.html（history 路由）。
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── app H5 dist（子路径 /app/，静态 serve）──────────────────────
        # app manifest h5.router.base 为相对 './'（资产相对 index.html 解析），
        # 挂 /app/ 子路径自洽：/app/index.html 内相对 ./assets/... → /app/assets/...。
        location /app/ {
            alias /usr/share/nginx/html/app/;
            index index.html;
            try_files $uri $uri/ /app/index.html;
        }

        # ── Java/agent/RAG API 全反代到 gateway（gateway 剥前缀路由上游）─────────
        # gateway 的 RequestRateLimiter 需要真实客户端 IP：本层已写 X-Real-IP，
        # gateway 侧 RATE_LIMIT_TRUST_PROXY=true 即读它（否则 remoteAddress=本容器恒单桶）。
        location ~ ^/(agent-api|mall-api|search-api|admin-api|rag-api)(/|$) {
            proxy_pass http://gateway_upstream;
            proxy_set_header Connection "";   # 1.1 + 空 Connection → 复用 keepalive 池
        }

        # ── WebSocket：/agent-api/api/mall/chat/ws（gateway 剥 /agent-api 后路由到 agent）──
        # gateway 是 WebFlux，WS Upgrade 由其透明处理；nginx 只透传 Upgrade 握手头。
        # 必须用 ^~：普通前缀 location 会被下方正则块（~ ^/(agent-api|...)）抢优先（正则
        # 高于普通前缀），^~ 使本前缀匹配后不再评估正则 → WS 握手 Upgrade 头才透传对。
        location ^~ /agent-api/api/mall/chat/ws {
            proxy_pass http://gateway_upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API 反代正则块：/agent-api 等五前缀（WS 已用 ^~ 独占，不落这里）───────────
        # 注意：这里不需再单列 WS，因 ^~ 前缀已拦截 /agent-api/api/mall/chat/ws。
    }
}
